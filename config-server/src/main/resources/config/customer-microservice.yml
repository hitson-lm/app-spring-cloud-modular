server:
  port: 8091

spring:
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI}
#      host: localhost
#      port: 27017
#      database: customer_db
#      username: root
#      password: pass
#      authentication-database: admin

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO # Establece el nivel de log para toda la aplicación.
    pe.com.hlm.microservices: WARN # Establece el nivel de log específico para el paquete de la aplicación.
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/customer-microservice.log # registro de logs en el módulo customer-microservice
    max-size: 10MB
    max-history: 30
